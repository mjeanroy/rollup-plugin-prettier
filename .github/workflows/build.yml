name: CI
on: [push]
permissions: {}
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
        node: [ 18, 19, 20, 21, 22, 23, 24, 25, 26 ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout
        with:
          persist-credentials: false
          allow-unsafe-pr-checkout: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        name: Set up NodeJS
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # pnpm/setup installs the self-contained pnpm binary, so pnpm >= 11 (requiring node >= 22.13)
      # can run while tests still run with the node version of the matrix.
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        name: Set up PNPM
        with:
          version: 11.28.12
          cache: false
          install: false
          node-version-file: false
      - name: Install
        run: pnpm install
      - name: Test
        run: pnpm test
